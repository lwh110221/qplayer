name: macOS x64 (Intel) build

# Upstream publishes an Apple Silicon DMG only. GraalVM CE stopped shipping a
# macOS x86-64 JDK after 25.0.1, so this workflow pins that last x64 release to
# build the same native QPlayer bundle on GitHub's Intel macOS runner.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-x64:
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      QPLAYER_VERSION: '2.0.0-rc.2'
      GRAAL_URL: 'https://github.com/graalvm/graalvm-ce-builds/releases/download/jdk-25.0.1/graalvm-community-jdk-25.0.1_macos-x64_bin.tar.gz'
    steps:
      - name: Check out the v2.0.0-rc.2 source
        uses: actions/checkout@v5
        with:
          ref: v2.0.0-rc.2

      - name: Adapt build args
        # --exact-reachability-metadata trips oracle/graal#13316 on the 25.0.x
        # native-image line (conditional bulk queries). The check is diagnostic
        # only, so drop it. Keep main() on the primordial thread, which macOS
        # GLFW requires.
        run: |
          sed -i '' '/--exact-reachability-metadata/d' desktop-host/pom.xml
          perl -0pi -e 's|<buildArgs>|<buildArgs>\n                            <buildArg>-H:-RunMainInNewThread</buildArg>|' desktop-host/pom.xml

      - name: Install GraalVM CE 25.0.1 (last macOS x86-64 build)
        run: |
          curl -fL --retry 5 --retry-delay 3 -o "$RUNNER_TEMP/graal.tar.gz" "$GRAAL_URL"
          mkdir -p "$RUNNER_TEMP/graal"
          tar -xzf "$RUNNER_TEMP/graal.tar.gz" -C "$RUNNER_TEMP/graal" --strip-components=1
          rm -f "$RUNNER_TEMP/graal.tar.gz"
          GRAAL_HOME="$(find "$RUNNER_TEMP/graal" -type d -path '*/Contents/Home' | head -1)"
          echo "JAVA_HOME=$GRAAL_HOME" >> "$GITHUB_ENV"
          echo "$GRAAL_HOME/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          uname -m
          java -version
          native-image --version
          mvn -version

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-desktop-x64-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-desktop-x64-

      - name: Install player-core
        run: mvn -B -DskipTests -pl player-core -am install

      - name: Compile native app and bundled QML
        run: |
          mvn -B -DskipTests -Dqplayer.app.version="${QPLAYER_VERSION}" \
            -pl desktop-host -am -Pdist package

      - name: Smoke native AOT factories and reachability
        run: desktop-host/target/qplayer --build-smoke

      - name: Package DMG
        run: bash desktop-host/dist/package-macos.sh

      - name: Stage artifact
        run: |
          mkdir -p out
          cp desktop-host/target/QPlayer.dmg out/QPlayer-macos-x64.dmg
          ls -lh out

      - name: Upload native-image error report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: svm-error-report
          path: desktop-host/target/svm_err_*.md
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        with:
          name: QPlayer-macos-x64
          path: out/QPlayer-macos-x64.dmg
          if-no-files-found: error
